# SEED data for the domain_tiers table. Loaded once with `uv run python -m radar.admin seed`
# (inserts missing rows only, never overwrites edits made on the dashboard or via admin).
# Official domains come from protected_names.yaml and are seeded as TRUSTED automatically.
#
# Any entry whose note contains UNREVIEWED is SKIPPED by seed. To approve one, change its
# note (e.g. to "approved 2026-10-26") and run seed again.

