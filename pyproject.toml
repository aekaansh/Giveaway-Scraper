[project]
name = "giveaway-radar"
version = "0.1.0"
description = "Discover, classify and alert on Pokemon TCG giveaways. The human enters manually."
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.6.0",
    "httpx>=0.28",
    "pydantic>=2.14.3",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "selectolax>=1.0.2",
    "tldextract>=5.1",
    "turso-serverless>=0.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
